[project]
name = "protonmail-mcp-connector"
version = "0.2.9"
description = "Model Context Protocol server for ProtonMail integration"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Michael Eakins", email = "michael@blackholesoftware.dev" }
]
license = { text = "MIT" }
keywords = ["mcp", "protonmail", "ai", "claude", "email"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
    "protonmail-api-client>=2.4.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/CrashBytes/protonmail-mcp-connector"
Repository = "https://github.com/CrashBytes/protonmail-mcp-connector"
Issues = "https://github.com/CrashBytes/protonmail-mcp-connector/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat-module layout: explicitly include only the real source modules.
# Avoids packaging tests, examples, setup scripts, .env.example, uv.lock, etc.
include = [
    "protonmail_client.py",
    "protonmail_client_imap.py",
    "protonmail_server.py",
    "protonmail_server_imap.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "protonmail_client.py",
    "protonmail_client_imap.py",
    "protonmail_server.py",
    "protonmail_server_imap.py",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]
